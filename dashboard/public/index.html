<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin Alley Ventures - Alumni Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Tin Alley Ventures</h1>
        <div class="subtitle">Alumni Intelligence</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Dashboard</div>
          <a class="nav-item active" data-page="overview" onclick="navigate('overview')">
            <span class="icon">&#9673;</span>
            <span>Overview</span>
          </a>
          <a class="nav-item" data-page="signals" onclick="navigate('signals')">
            <span class="icon">&#9889;</span>
            <span>Signal Feed</span>
            <span class="badge urgent" id="unread-badge" style="display:none">0</span>
          </a>
          <a class="nav-item" data-page="digest" onclick="navigate('digest')">
            <span class="icon">&#9993;</span>
            <span>Daily Digest</span>
          </a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Pipeline</div>
          <a class="nav-item" data-page="founders" onclick="navigate('founders')">
            <span class="icon">&#9733;</span>
            <span>Founders</span>
            <span class="badge" id="founders-count">0</span>
          </a>
          <a class="nav-item" data-page="leaders" onclick="navigate('leaders')">
            <span class="icon">&#9650;</span>
            <span>Leaders</span>
            <span class="badge" id="leaders-count">0</span>
          </a>
          <a class="nav-item" data-page="watching" onclick="navigate('watching')">
            <span class="icon">&#9737;</span>
            <span>Watching</span>
            <span class="badge" id="watching-count">0</span>
          </a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Manage</div>
          <a class="nav-item" data-page="all-alumni" onclick="navigate('all-alumni')">
            <span class="icon">&#9782;</span>
            <span>All Alumni</span>
          </a>
          <a class="nav-item" data-page="import" onclick="navigate('import')">
            <span class="icon">&#8657;</span>
            <span>Import Data</span>
          </a>
          <a class="nav-item" data-page="sources" onclick="navigate('sources')">
            <span class="icon">&#9881;</span>
            <span>Data Sources</span>
          </a>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main" id="main-content">
      <!-- Content loaded dynamically by app.js -->
    </main>

    <!-- Profile Slide Panel -->
    <div class="profile-panel" id="profile-panel">
      <div class="profile-header">
        <div class="profile-top">
          <div class="avatar profile-avatar" id="profile-avatar">--</div>
          <button class="btn-icon" onclick="closeProfile()" title="Close">&times;</button>
        </div>
        <div class="profile-name" id="profile-name">--</div>
        <div class="profile-meta" id="profile-meta">--</div>
        <div class="profile-tags" id="profile-tags"></div>
      </div>
      <div class="profile-section">
        <h4>Details</h4>
        <div id="profile-details"></div>
      </div>
      <div class="profile-section">
        <h4>Career History</h4>
        <div id="profile-companies"></div>
      </div>
      <div class="profile-section">
        <h4>Signal History</h4>
        <div id="profile-signals"></div>
      </div>
      <div class="profile-section">
        <div class="flex items-center gap-8" style="margin-bottom:12px;justify-content:space-between">
          <h4 style="margin:0">Add Signal</h4>
        </div>
        <div id="profile-add-signal"></div>
      </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="modal-title">Modal</h3>
          <button class="btn-icon" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>

    <!-- Toast notifications -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
